server {
    # Веб-сервер слушает стандартный 80-й порт внутри контейнера
    listen 80;
    server_name localhost;

    # Основная директория со скомпилированными файлами React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # 👑 Критично для Single Page Application (SPA):
        # Если пользователь обновит страницу на URL типа /appeals или /profile,
        # Nginx не найдет такую физическую папку и вместо ошибки 404 вернет index.html.
        # Дальше управление маршрутами перехватит React Router.
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ресурсов (картинки, шрифты, стили, скрипты)
    # Это значительно ускоряет повторную загрузку приложения у пользователя
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Настройка обработки внутренних ошибок сервера
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
